plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.18.4'
}

base {
	archivesName = "commanddeck"
}

version = "${mod_version}+fabric-mc1.14-1.18"
def mcRange = '>=1.14 <1.19'
def javaMin = '8'

sourceSets.main.java.srcDirs = ['../../common/java', '../../send/chat', '../../loader/fabric/java']
sourceSets.main.resources.srcDirs = ['../../common/resources', '../../loader/fabric/resources']

dependencies {
	minecraft "com.mojang:minecraft:1.16.5"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:0.12.12"
}

processResources {
	def props = [version: project.version, mc_range: mcRange, java: javaMin]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

jar {
	from("../../LICENSE")
}
