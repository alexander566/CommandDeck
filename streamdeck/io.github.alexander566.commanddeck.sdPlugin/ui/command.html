<!doctype html>
<html><head><meta charset="utf-8">
<style>
body { margin: 0; padding: 8px 12px; background: #2d2d2d; color: #d8d8d8; font: 13px "Segoe UI", -apple-system, sans-serif; }
label { display: block; margin: 10px 0 4px; color: #9a9a9a; }
textarea { box-sizing: border-box; width: 100%; padding: 6px 8px; background: #3d3d3d; border: 1px solid #4a4a4a; border-radius: 3px; color: #fff; font: 13px Consolas, Menlo, monospace; min-height: 64px; resize: vertical; }
textarea:focus { outline: none; border-color: #58AA60; }
p { margin: 8px 0 0; color: #8a8a8a; font-size: 12px; line-height: 1.5; }
</style></head>
<body>
<label for="command">Command</label>
<textarea id="command" placeholder="/spawn"></textarea>
<p>One command per line, sent in order. Start with / for a command, anything else is sent as a chat message.</p>
<p>Needs the CommandDeck mod in Minecraft.</p>
<script>
let ws, uuid, settings = {};
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
  uuid = inUUID;
  try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) {}
  const el = document.getElementById('command');
  el.value = settings.command || '';
  el.addEventListener('input', () => { settings.command = el.value; save(); });
  ws = new WebSocket('ws://127.0.0.1:' + port);
  ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
}
function save() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
}
</script>
</body></html>
